{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Regent & Associates - Dashboard</title>
    <link
        rel="icon"
        type="image/jpeg"
        href="{% static 'img/ra-logo.jpg' %}"
    >
    <meta name="theme-color" content="#001F3F">
    <link
        rel="stylesheet"
        href="{% static 'css/styles.css' %}?v=6"
    >
    <script
        src="{% static 'js/main.js' %}?v=2"
        defer
    ></script>
</head>

<body>
<header class="top-header">
    <div class="brand">
        <img
            src="{% static 'img/ra-logo.jpeg' %}"
            alt=""
        >
        <span>Regent &amp; Associates</span>
    </div>
    <nav class="top-nav">
        <a
            href="/"
            class="active-nav"
        >
            Dashboard
        </a>
        <a href="/client/">
            Clients
        </a>
    </nav>
</header>

<div class="green-line"></div>

<main class="page-container">
    <form id="dashboardCsrf" hidden>{% csrf_token %}</form>
    <!-- =========================
         DASHBOARD HEADER
         ========================= -->
    <section class="page-heading">
        <div>
            <h1>
                Dashboard
            </h1>
            <p id="reportingPeriodText">
            </p>
        </div>
        <button
            id="importClientDataBtn"
            class="app-button"
            type="button"
        >
            Import Client Data
        </button>
        <input
            id="csvFileInput"
            type="file"
            accept=".csv,text/csv"
            hidden
        >
    </section>
    <!-- =========================
         MESSAGE AREA
         ========================= -->
    <div
        id="messageBox"
        class="message hidden"
    ></div>
    <!-- =========================
         CLIENT TABLE
         ========================= -->
    <section class="table-panel">
        <table
            id="clientTable"
            class="data-table"
        >
            <thead>
                <tr>
                    <th class="checkbox-column">
                        <div class="rollover-header">
                            <button
                                id="rolloverSelectedBtn"
                                type="button"
                                class="table-header-button"
                            >
                                Rollover
                            </button>
                        </div>
                    </th>
                    <th>
                        Client
                    </th>
                    <th>
                        Recoveries
                    </th>
                    <th>
                        Costs
                    </th>
                    <th>
                        Commission
                    </th>
                    <th>
                        Net Remit
                    </th>
                </tr>
            </thead>
            <tbody id="clientTableBody">
            </tbody>
        </table>
        <!-- =========================
             TABLE FOOTER
             ========================= -->
        <div class="table-footer">
            <div class="footer-left">
                <button
                    id="rolloverAllBtn"
                    type="button"
                    class="secondary-button"
                >
                    Roll Over All
                </button>
            </div>
            <div class="pagination">
                <button
                    id="previousPageBtn"
                    type="button"
                >
                    &lt;
                </button>
                <span id="pageIndicator">
                    1 of 1
                </span>
                <button
                    id="nextPageBtn"
                    type="button"
                >
                    &gt;
                </button>
            </div>
            <div class="footer-right">
                <button id="generateSelectedReportBtn" type="button" class="secondary-button">Generate Selected Report</button>
                <button
                    id="generateAllReportsBtn"
                    type="button"
                    class="app-button"
                >
                    Generate All Reports
                </button>
            </div>
        </div>
    </section>
</main>
<script>
    // The dashboard script loads the latest imported reporting month.
    const reportingPeriodText = document.getElementById("reportingPeriodText");
    if (reportingPeriodText) {
        const currentMonth = new Intl.DateTimeFormat("en-US", {
            month: "long",
            year: "numeric"
        }).format(new Date());
        reportingPeriodText.textContent = "Loading reporting month...";
    }
</script>

<footer class="site-footer">
    <p>By Charmed Solutions</p>
</footer>

</body>
</html>
