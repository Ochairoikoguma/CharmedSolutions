{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Regent & Associates - Clients</title>

    <link
        rel="stylesheet"
        href="{% static 'css/styles.css' %}"
    >

    <script
        src="{% static 'js/client.js' %}"
        defer
    ></script>

</head>


<body>

<header class="top-header">

    <div class="brand">
        Regent &amp; Associates
    </div>

    <nav class="top-nav">

        <a href="/">
            Dashboard
        </a>

        <a
            href="/client/"
            class="active-nav"
        >
            Clients
        </a>

        <a href="#">
            Reports
        </a>

    </nav>

</header>


<div class="green-line"></div>


<main class="client-page-container">


    <div
        id="clientMessage"
        class="message hidden"
    ></div>


    <section class="three-column-layout">


        <!-- =========================
             COLUMN 1
             CLIENT LIST
             ========================= -->

        <div class="client-column">

            <div class="column-header">
                Client List
            </div>


            <div
                id="clientList"
                class="client-list"
            >

                <button
                    type="button"
                    class="client-name active"
                    data-client="1"
                >
                    Alpha Funding
                </button>


                <button
                    type="button"
                    class="client-name"
                    data-client="2"
                >
                    Capital Advance
                </button>


                <button
                    type="button"
                    class="client-name"
                    data-client="3"
                >
                    Merchant Funding
                </button>


                <button
                    type="button"
                    class="client-name"
                    data-client="4"
                >
                    Premier Capital
                </button>

            </div>


            <div class="column-footer">

                <button
                    id="createClientBtn"
                    type="button"
                    class="app-button"
                >
                    Create New Client
                </button>

            </div>

        </div>



        <!-- =========================
             COLUMN 2
             CLIENT DETAILS
             ========================= -->

        <div class="client-column">

            <div class="column-header">
                Client Details
            </div>


            <form
                id="clientForm"
                class="client-details-form"
            >


                <label for="clientId">
                    Client ID
                </label>

                <input
                    id="clientId"
                    type="text"
                    value="1"
                    readonly
                >


                <label for="clientName">
                    Client Name
                </label>

                <input
                    id="clientName"
                    type="text"
                    value="Alpha Funding"
                >


                <label for="commissionRate">
                    Default Commission Rate
                </label>

                <div class="percent-input">

                    <input
                        id="commissionRate"
                        type="number"
                        min="0"
                        max="100"
                        value="20"
                    >

                    <span>%</span>

                </div>


                <label for="dateAdded">
                    Date Added
                </label>

                <input
                    id="dateAdded"
                    type="text"
                    value="10/01/2026"
                    readonly
                >


                <div class="details-actions">

                    <button
                        type="submit"
                        class="app-button"
                    >
                        Save Changes
                    </button>


                    <button
                        id="deleteClientBtn"
                        type="button"
                        class="delete-button"
                    >
                        Delete Client
                    </button>

                </div>

            </form>

        </div>



        <!-- =========================
             COLUMN 3
             REPORT HISTORY
             ========================= -->

        <div class="client-column">

            <div class="column-header">
                Report History
            </div>


            <div
                id="reportHistory"
                class="report-history"
            >


                <a
                    href="/reports/saved/1/download/"
                    target="_blank"
                    class="report-history-item"
                >

                    <span>
                        October, 2026
                    </span>

                </a>


                <a
                    href="/reports/saved/2/download/"
                    target="_blank"
                    class="report-history-item"
                >

                    <span>
                        September, 2026
                    </span>

                </a>


                <a
                    href="/reports/saved/3/download/"
                    target="_blank"
                    class="report-history-item"
                >

                    <span>
                        August, 2026
                    </span>

                </a>

            </div>

        </div>


    </section>

</main>

</body>

</html>
